name: Release live host schema strict read-only preflight

on:
  push:
    branches:
      - "evidence/release-live-host-schema-readonly-2026-08-18"
    paths:
      - ".github/workflows/release-live-host-schema-readonly.yml"
      - "tools/release-live-host-schema-readonly.php"

permissions:
  contents: read
  issues: write

jobs:
  live-host-schema-readonly:
    name: Temporary live inspector, read-only DB, mandatory cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STRATO_FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
      STRATO_FTP_USERNAME: ${{ secrets.STRATO_FTP_USERNAME }}
      STRATO_FTP_PASSWORD: ${{ secrets.STRATO_FTP_PASSWORD }}
      STRATO_SFTP_PHASE_ATTEMPTS: "3"
      STRATO_SFTP_RETRY_BASE_SECONDS: "5"
      STRATO_SFTP_MAX_PARALLEL: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4

      - name: Install SFTP client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Validate inspector syntax
        shell: bash
        run: php -l tools/release-live-host-schema-readonly.php

      - name: Upload random inspector, read schema, remove inspector
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence host-preflight-payload/api host-preflight-empty

          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 12)"
          REMOTE_FILE="_release_schema_${RUN_KEY}.php"
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$TOKEN"

          LIVE_URL="https://bocholt-erleben.de/api/$REMOTE_FILE"
          PRE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$LIVE_URL")"
          printf 'live_http_before_upload=%s\n' "$PRE_CODE" > evidence/release-live-host-http-boundary.txt
          [ "$PRE_CODE" = "404" ]

          export REMOTE_FILE TOKEN_HASH
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path('tools/release-live-host-schema-readonly.php').read_text(encoding='utf-8')
          source = source.replace('__TOKEN_HASH__', os.environ['TOKEN_HASH'])
          target = Path('host-preflight-payload/api') / os.environ['REMOTE_FILE']
          target.write_text(source, encoding='utf-8')
          PY
          php -l "host-preflight-payload/api/$REMOTE_FILE"

          printf 'rm -f "api/%s"\n' "$REMOTE_FILE" > host-preflight-delete.lftp

          cleanup() {
            set +e
            local cleanup_status=0
            DEPLOY_TARGET_DIR="." bash scripts/run_strato_sftp_phase.sh host-preflight-empty 1 host-preflight-delete.lftp || cleanup_status=1
            printf 'cleanup_status=%s\n' "$cleanup_status" > evidence/release-live-host-cleanup-status.txt
            set -e
            return "$cleanup_status"
          }
          trap 'cleanup || true' EXIT

          DEPLOY_TARGET_DIR="." bash scripts/run_strato_sftp_phase.sh host-preflight-payload 1

          UNAUTH_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$LIVE_URL")"
          printf 'live_http_without_token=%s\n' "$UNAUTH_CODE" >> evidence/release-live-host-http-boundary.txt
          [ "$UNAUTH_CODE" = "404" ]

          curl -fsS --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            -H "X-BE-Evidence-Token: $TOKEN" \
            "${LIVE_URL}?run=${GITHUB_RUN_ID}" \
            -o evidence/release-live-host-schema.json

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report_path = Path('evidence/release-live-host-schema.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('status') != 'PASS':
              raise SystemExit('live report status is not PASS')
          if report.get('environment') != 'live':
              raise SystemExit(f"unexpected environment: {report.get('environment')!r}")
          if report.get('database_name_matches_config') is not True:
              raise SystemExit('database identity mismatch')
          if report.get('read_only_transaction_enforced') is not True:
              raise SystemExit('read-only transaction not enforced')
          if report.get('write_operations_executed') is not False:
              raise SystemExit('DB write safety flag is not false')
          if report.get('personal_or_business_rows_exported') is not False:
              raise SystemExit('row export safety flag is not false')

          tables = report.get('tables') or {}
          startpartner = report.get('startpartner_row_counts') or {}
          integrity = report.get('integrity_counts') or {}
          flags = report.get('submissions_reconciliation_flags') or {}

          relevant_baseline_tables = [
              'organizers', 'submissions', 'subscriptions', 'publication_entitlements',
              'publication_consumptions', 'organizer_magic_links', 'organizer_portal_sessions',
              'webhook_events', 'value_metric_daily',
              'control_cases', 'control_case_events', 'control_content_changes',
              'control_development_snapshots', 'control_operations', 'control_editorial_feedback',
              'content_ops_run', 'content_ops_metric_daily', 'content_ops_action_log',
              'feedback_rule_effectiveness_daily',
          ]
          missing_relevant = [name for name in relevant_baseline_tables if name not in tables]

          fk_summary = {}
          for name in ('control_case_events', 'control_operations', 'control_editorial_feedback'):
              fk_summary[name] = (tables.get(name) or {}).get('foreign_keys', [])

          summary = {
              'report_type': 'release_live_host_schema_readonly_summary',
              'overall_status': 'PASS',
              'environment': report.get('environment'),
              'database_name_matches_config': report.get('database_name_matches_config'),
              'server_version': report.get('server_version'),
              'table_count': len(tables),
              'missing_relevant_baseline_tables': missing_relevant,
              'migration_keys': report.get('migration_keys') or [],
              'startpartner_tables_existing': sorted(startpartner.keys()),
              'startpartner_row_counts': startpartner,
              'integrity_counts': integrity,
              'all_reported_fk_orphan_counts_zero': all(int(value) == 0 for value in integrity.values()),
              'submissions_reconciliation_flags': flags,
              'control_center_foreign_keys': fk_summary,
              'read_only_transaction_enforced': True,
              'write_operations_executed': False,
              'personal_or_business_rows_exported': False,
          }
          serialized = json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          Path('evidence/release-live-host-summary.json').write_text(serialized, encoding='utf-8')
          digest = hashlib.sha256(serialized.encode('utf-8')).hexdigest()
          Path('evidence/release-live-host-summary.sha256').write_text(
              f'{digest}  release-live-host-summary.json\n', encoding='utf-8'
          )
          print(f'summary_sha256={digest}')
          print(f'table_count={len(tables)}')
          print(f'missing_relevant_baseline_tables={len(missing_relevant)}')
          print(f'startpartner_tables_existing={len(startpartner)}')
          print(f'integrity_counts={integrity}')
          PY

          cleanup

          POST_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$LIVE_URL")"
          printf 'live_http_after_cleanup=%s\n' "$POST_CODE" >> evidence/release-live-host-http-boundary.txt
          [ "$POST_CODE" = "404" ]
          trap - EXIT

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-live-host-schema-readonly-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized workpack pointer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          summary_path = Path('evidence/release-live-host-summary.json')
          cleanup_path = Path('evidence/release-live-host-cleanup-status.txt')
          http_path = Path('evidence/release-live-host-http-boundary.txt')

          print('## Authorized live-host schema readback')
          print()
          print(f"- run_id: `{os.environ.get('GITHUB_RUN_ID')}`")
          print(f"- head_sha: `{os.environ.get('GITHUB_SHA')}`")
          if summary_path.is_file():
              data = json.loads(summary_path.read_text(encoding='utf-8'))
              print(f"- readback_status: **{data.get('overall_status')}**")
              print(f"- server_version: `{data.get('server_version')}`")
              print(f"- table_count: `{data.get('table_count')}`")
              print(f"- missing_relevant_baseline_tables: `{len(data.get('missing_relevant_baseline_tables') or [])}`")
              print(f"- startpartner_tables_existing: `{len(data.get('startpartner_tables_existing') or [])}`")
              print(f"- FK_orphan_counts_zero: `{data.get('all_reported_fk_orphan_counts_zero')}`")
              print(f"- read_only_transaction_enforced: `{data.get('read_only_transaction_enforced')}`")
              print(f"- db_writes_executed: `{data.get('write_operations_executed')}`")
              print(f"- business_or_person_rows_exported: `{data.get('personal_or_business_rows_exported')}`")
          else:
              print('- readback_status: **FAIL / no validated summary**')
          print(f"- cleanup: `{cleanup_path.read_text(encoding='utf-8').strip() if cleanup_path.is_file() else 'missing'}`")
          if http_path.is_file():
              for line in http_path.read_text(encoding='utf-8').splitlines():
                  if line.startswith('live_http_after_cleanup='):
                      print(f"- {line}")
          print()
          print('No DB migration, DDL, DML, mail, Stripe, Formspree, entitlement, publication or partner action was executed.')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/292/comments" -f body="$(cat /tmp/comment.md)"
