# === BEGIN FILE: .github/workflows/growth-intelligence-backlog.yml | Zweck: erzeugt woechentlich deduplizierte Growth-/Acquisition-Backlog-Punkte aus GSC/GA4 ohne KI-Suchlauf-Kopplung; Umfang: kompletter Workflow ===
name: Growth Intelligence Backlog

on:
  # Manuell im GitHub UI startbar (Actions → Workflow → Run workflow).
  # Bewusst ohne Inputs, damit GitHub den Button genauso wie bei Deploy to STRATO anzeigt.
  # Branch-Auswahl fuer main/staging kommt automatisch von GitHub.
  workflow_dispatch:

  schedule:
    # Woechentlich Montagmorgen: nach einer vollen Vorwoche neue Growth-/Acquisition-Hinweise sammeln.
    - cron: "20 5 * * 1"

permissions:
  contents: read

jobs:
  growth_intelligence_backlog:
    # Echte Backlog-Erzeugung nur manuell oder geplant, nicht bei technischen Staging-Testcommits.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google API dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth pymysql

      - name: Resolve Growth runtime
        shell: bash
        env:
          LIVE_SHEET_ID: ${{ secrets.LIVE_SHEET_ID }}
          LEGACY_SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          set -e
          BE_SHEET_ID="${LIVE_SHEET_ID:-${LEGACY_SHEET_ID:-}}"
          if [ -z "$BE_SHEET_ID" ]; then
            echo "❌ LIVE_SHEET_ID oder SHEET_ID fehlt."
            exit 1
          fi

          echo "GROWTH_BACKLOG_TAB=Growth_Backlog" >> "$GITHUB_ENV"
          echo "GROWTH_REPORT_TAB=Growth_Intelligence_Report" >> "$GITHUB_ENV"
          echo "BE_SHEET_ID=$BE_SHEET_ID" >> "$GITHUB_ENV"
          echo "GROWTH_LOOKBACK_DAYS=30" >> "$GITHUB_ENV"
          echo "Growth lookback days: 30"

      - name: Update Growth Backlog
        timeout-minutes: 10
        shell: bash
        env:
          BE_SHEET_ID: ${{ env.BE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          SEARCH_METRICS_GOOGLE_SITE_URL: ${{ secrets.SEARCH_METRICS_GOOGLE_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GROWTH_LOOKBACK_DAYS: ${{ env.GROWTH_LOOKBACK_DAYS }}
          GROWTH_BACKLOG_TAB: ${{ env.GROWTH_BACKLOG_TAB }}
          GROWTH_REPORT_TAB: ${{ env.GROWTH_REPORT_TAB }}
          BE_ENVIRONMENT: ${{ github.ref_name }}
          LIVE_DB_HOST: ${{ secrets.LIVE_DB_HOST }}
          LIVE_DB_NAME: ${{ secrets.LIVE_DB_NAME }}
          LIVE_DB_USER: ${{ secrets.LIVE_DB_USER }}
          LIVE_DB_PASSWORD: ${{ secrets.LIVE_DB_PASSWORD }}
          LIVE_DB_PORT: ${{ secrets.LIVE_DB_PORT }}
          STAGING_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_PORT: ${{ secrets.STAGING_DB_PORT }}
        run: |
          set -e
          export GSC_SITE_URL="${GSC_SITE_URL:-${SEARCH_METRICS_GOOGLE_SITE_URL:-}}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import runpy
          import sys

          scripts_dir = Path("scripts").resolve()
          if str(scripts_dir) not in sys.path:
              sys.path.insert(0, str(scripts_dir))

          from content_coverage_metrics import augment_growth_summary, build_portfolio_coverage
          from gsc_history_snapshot import persist_gsc_snapshot

          summary_path = Path("data/growth-intelligence-summary.json")
          ns = runpy.run_path(
              "scripts/growth-intelligence-backlog.py",
              run_name="__growth_runtime__",
              init_globals={"GROWTH_SUMMARY_PATH": summary_path},
          )
          runtime = ns["main"].__globals__

          captured = {
              "gsc_rows": [],
              "gsc_status": "not_run",
              "gsc_error": "",
              "ga4_rows": [],
              "value_rows": [],
              "event_sheet_rows": [],
          }
          original_fetch_gsc = runtime["fetch_gsc"]
          original_fetch_ga4 = runtime["fetch_ga4"]
          original_fetch_value_metrics = runtime["fetch_value_metrics"]
          original_values_get = runtime["values_get"]

          def observed_fetch_gsc(*args, **kwargs):
              try:
                  rows = original_fetch_gsc(*args, **kwargs)
              except Exception as exc:
                  captured["gsc_status"] = "error"
                  captured["gsc_error"] = f"{type(exc).__name__}: {exc}"
                  raise
              captured["gsc_rows"] = rows
              captured["gsc_status"] = "ok"
              return rows

          def observed_fetch_ga4(*args, **kwargs):
              rows, diagnostic = original_fetch_ga4(*args, **kwargs)
              captured["ga4_rows"] = rows
              return rows, diagnostic

          def observed_fetch_value_metrics(*args, **kwargs):
              rows = original_fetch_value_metrics(*args, **kwargs)
              captured["value_rows"] = rows
              return rows

          def observed_values_get(sheets, spreadsheet_id, tab, rng="A:ZZ"):
              rows = original_values_get(sheets, spreadsheet_id, tab, rng)
              if tab == "Events":
                  captured["event_sheet_rows"] = rows
              return rows

          runtime["fetch_gsc"] = observed_fetch_gsc
          runtime["fetch_ga4"] = observed_fetch_ga4
          runtime["fetch_value_metrics"] = observed_fetch_value_metrics
          runtime["values_get"] = observed_values_get
          runtime["main"]()

          summary_payload = json.loads(summary_path.read_text(encoding="utf-8"))
          if captured["gsc_status"] == "error":
              gsc_history_snapshot = {
                  "status": "skipped",
                  "diagnostic": f"Query-page GSC read failed; complete snapshot not persisted: {captured['gsc_error']}",
                  "additional_gsc_calls": 0,
                  "query_page_rows": 0,
              }
          else:
              creds = runtime["parse_sa"]()
              gsc_history_snapshot = persist_gsc_snapshot(
                  gsc_rows=captured["gsc_rows"],
                  search_console=runtime["service"]("searchconsole", "v1", creds),
                  sheets=runtime["service"]("sheets", "v4", creds),
                  spreadsheet_id=os.environ["BE_SHEET_ID"],
                  site_url=os.environ.get("GSC_SITE_URL", ""),
                  period_start=str(summary_payload.get("period_start", "")),
                  period_end=str(summary_payload.get("period_end", "")),
                  captured_at=str(summary_payload.get("generated_at", "")),
                  ensure_sheet=runtime["ensure_sheet"],
                  append_records=runtime["append_records"],
              )
          summary_payload["gsc_history_snapshot"] = gsc_history_snapshot
          summary_path.write_text(json.dumps(summary_payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          offers_path = Path("data/offers.json")
          targets_path = Path("data/event_coverage_targets.json")
          offers_payload = json.loads(offers_path.read_text(encoding="utf-8")) if offers_path.exists() else {"offers": []}
          targets_payload = json.loads(targets_path.read_text(encoding="utf-8")) if targets_path.exists() else []

          coverage = build_portfolio_coverage(
              captured["gsc_rows"],
              captured["event_sheet_rows"],
              offers_payload,
              targets_payload,
              ga4_rows=captured["ga4_rows"],
              value_rows=captured["value_rows"],
              infer_intent=runtime["infer_intent"],
              canonical_topic=runtime["canonical_topic"],
              min_impressions=runtime["MIN_IMPRESSIONS"],
          )
          augment_growth_summary(summary_path, coverage)
          print("GROWTH PORTFOLIO COVERAGE")
          print(f"- demand_clusters: {len(coverage['demand_clusters'])}")
          print(f"- demand_gap_count: {coverage['demand_gap_count']}")
          print(f"- offers_total: {coverage['activity_inventory']['offers_total']}")
          print(f"- events_total: {coverage['event_inventory']['events_total']}")
          print(f"- known_target_presence_rate: {coverage['event_inventory']['known_target_presence_rate']}")
          print(f"- additional_ai_calls: {coverage['cost']['additional_ai_calls']}")
          print(f"- additional_web_search_calls: {coverage['cost']['additional_web_search_calls']}")
          print(f"- additional_gsc_calls: {coverage['cost']['additional_gsc_calls']}")
          print(f"- additional_ga4_calls: {coverage['cost']['additional_ga4_calls']}")
          print("GSC HISTORY SNAPSHOT")
          print(f"- status: {gsc_history_snapshot.get('status', '')}")
          print(f"- snapshot_id: {gsc_history_snapshot.get('snapshot_id', '')}")
          print(f"- query_page_rows: {gsc_history_snapshot.get('query_page_rows', 0)}")
          print(f"- additional_gsc_calls: {gsc_history_snapshot.get('additional_gsc_calls', 0)}")
          PY

      # === BEGIN BLOCK: CONTENT_OPS_RECORD_GROWTH_IMPACT_V1 | Zweck: persistiert Growth-/Acquisition-Signale in der gemeinsamen Verwaltungs-Metrikschicht; Umfang: keine Aenderung an Backlog-Erzeugung ===
      - name: Record Content Ops growth impact
        if: always()
        shell: bash
        env:
          BE_ENVIRONMENT: ${{ github.ref_name == 'staging' && 'staging' || 'live' }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIVE_DB_HOST: ${{ secrets.LIVE_DB_HOST }}
          LIVE_DB_NAME: ${{ secrets.LIVE_DB_NAME }}
          LIVE_DB_USER: ${{ secrets.LIVE_DB_USER }}
          LIVE_DB_PASSWORD: ${{ secrets.LIVE_DB_PASSWORD }}
          LIVE_DB_PORT: ${{ secrets.LIVE_DB_PORT }}
          STAGING_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_PORT: ${{ secrets.STAGING_DB_PORT }}
        run: |
          set -e
          python scripts/content-ops-control.py record-growth

      - name: Send Content Ops growth impact to HTTP ingest
        if: always()
        shell: bash
        env:
          CONTENT_OPS_INGEST_URL: ${{ secrets.CONTENT_OPS_INGEST_URL }}
          CONTENT_OPS_INGEST_TOKEN: ${{ secrets.CONTENT_OPS_INGEST_TOKEN }}
        run: |
          set -e
          python scripts/content-ops-http-ingest.py --input data/content-ops

      - name: Upload growth content ops impact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-content-ops-impact
          path: |
            data/growth-intelligence-summary.json
            data/content-ops/*.json
          if-no-files-found: ignore
      # === END BLOCK: CONTENT_OPS_RECORD_GROWTH_IMPACT_V1 ===
# === END FILE: .github/workflows/growth-intelligence-backlog.yml ===
