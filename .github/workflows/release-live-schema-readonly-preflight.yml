name: Release live schema read-only preflight

on:
  pull_request:
    branches:
      - staging
    paths:
      - ".github/workflows/release-live-schema-readonly-preflight.yml"

permissions:
  contents: read

jobs:
  live-schema-readonly:
    if: github.head_ref == 'evidence/release-live-schema-readonly-2026-08-18'
    name: Live schema metadata only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIVE_DB_HOST: ${{ secrets.LIVE_DB_HOST }}
      LIVE_DB_PORT: ${{ secrets.LIVE_DB_PORT }}
      LIVE_DB_NAME: ${{ secrets.LIVE_DB_NAME }}
      LIVE_DB_USER: ${{ secrets.LIVE_DB_USER }}
      LIVE_DB_PASSWORD: ${{ secrets.LIVE_DB_PASSWORD }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install read-only client dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check pymysql==1.1.1

      - name: Read live schema metadata under read-only transaction
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          import pymysql

          REQUIRED = [
              "LIVE_DB_HOST",
              "LIVE_DB_NAME",
              "LIVE_DB_USER",
              "LIVE_DB_PASSWORD",
          ]

          def clean_scalar(value):
              if isinstance(value, bytes):
                  return value.decode("utf-8", errors="replace")
              return value

          def clean_rows(rows):
              return [
                  {str(key): clean_scalar(value) for key, value in row.items()}
                  for row in rows
              ]

          def fetch_all(cursor, sql, params=()):
              cursor.execute(sql, params)
              return clean_rows(cursor.fetchall())

          def normalize_create(sql):
              # Structural evidence only: do not expose current AUTO_INCREMENT counters.
              return re.sub(r"AUTO_INCREMENT=\d+", "AUTO_INCREMENT=<redacted>", sql or "")

          missing = [key for key in REQUIRED if not os.environ.get(key, "").strip()]
          report = {
              "report_type": "release_live_schema_readonly_preflight",
              "workpack_issue": 290,
              "write_operations_executed": False,
              "business_rows_exported": False,
              "live_filesystem_write_executed": False,
              "read_only_transaction_requested": False,
              "status": "PENDING",
              "missing_configuration_keys": missing,
              "database_name_matches_config": None,
              "server": {},
              "schema": {},
              "tables": {},
              "migration_keys": [],
          }

          connection = None
          exit_code = 0
          if missing:
              report["status"] = "FAIL"
              report["error_class"] = "MissingConfiguration"
              exit_code = 2
          else:
              try:
                  connection = pymysql.connect(
                      host=os.environ["LIVE_DB_HOST"].strip(),
                      port=int(os.environ.get("LIVE_DB_PORT", "").strip() or "3306"),
                      user=os.environ["LIVE_DB_USER"].strip(),
                      password=os.environ["LIVE_DB_PASSWORD"],
                      database=os.environ["LIVE_DB_NAME"].strip(),
                      charset="utf8mb4",
                      autocommit=False,
                      connect_timeout=20,
                      read_timeout=45,
                      write_timeout=45,
                      cursorclass=pymysql.cursors.DictCursor,
                  )
                  with connection.cursor() as cursor:
                      cursor.execute("START TRANSACTION READ ONLY")
                      report["read_only_transaction_requested"] = True

                      cursor.execute("SELECT DATABASE() AS database_name, VERSION() AS server_version")
                      identity = cursor.fetchone()
                      selected_database = str(identity.get("database_name") or "")
                      report["database_name_matches_config"] = (
                          selected_database == os.environ["LIVE_DB_NAME"].strip()
                      )
                      report["server"] = {
                          "version": str(identity.get("server_version") or ""),
                      }

                      schema_rows = fetch_all(
                          cursor,
                          """
                          SELECT DEFAULT_CHARACTER_SET_NAME, DEFAULT_COLLATION_NAME
                          FROM INFORMATION_SCHEMA.SCHEMATA
                          WHERE SCHEMA_NAME = %s
                          """,
                          (selected_database,),
                      )
                      report["schema"] = schema_rows[0] if schema_rows else {}

                      table_rows = fetch_all(
                          cursor,
                          """
                          SELECT TABLE_NAME, TABLE_TYPE, ENGINE, TABLE_COLLATION
                          FROM INFORMATION_SCHEMA.TABLES
                          WHERE TABLE_SCHEMA = %s
                          ORDER BY TABLE_NAME
                          """,
                          (selected_database,),
                      )

                      for table_row in table_rows:
                          table_name = str(table_row["TABLE_NAME"])
                          entry = {
                              "table_type": table_row.get("TABLE_TYPE"),
                              "engine": table_row.get("ENGINE"),
                              "table_collation": table_row.get("TABLE_COLLATION"),
                              "columns": fetch_all(
                                  cursor,
                                  """
                                  SELECT ORDINAL_POSITION, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE,
                                         COLUMN_DEFAULT, EXTRA, CHARACTER_SET_NAME, COLLATION_NAME
                                  FROM INFORMATION_SCHEMA.COLUMNS
                                  WHERE TABLE_SCHEMA = %s AND TABLE_NAME = %s
                                  ORDER BY ORDINAL_POSITION
                                  """,
                                  (selected_database, table_name),
                              ),
                              "indexes": fetch_all(
                                  cursor,
                                  """
                                  SELECT INDEX_NAME, NON_UNIQUE, SEQ_IN_INDEX, COLUMN_NAME,
                                         COLLATION, SUB_PART, INDEX_TYPE
                                  FROM INFORMATION_SCHEMA.STATISTICS
                                  WHERE TABLE_SCHEMA = %s AND TABLE_NAME = %s
                                  ORDER BY INDEX_NAME, SEQ_IN_INDEX
                                  """,
                                  (selected_database, table_name),
                              ),
                              "foreign_keys": fetch_all(
                                  cursor,
                                  """
                                  SELECT CONSTRAINT_NAME, COLUMN_NAME, REFERENCED_TABLE_NAME,
                                         REFERENCED_COLUMN_NAME, ORDINAL_POSITION
                                  FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE
                                  WHERE TABLE_SCHEMA = %s AND TABLE_NAME = %s
                                    AND REFERENCED_TABLE_NAME IS NOT NULL
                                  ORDER BY CONSTRAINT_NAME, ORDINAL_POSITION
                                  """,
                                  (selected_database, table_name),
                              ),
                              "show_create_table": None,
                          }

                          if str(table_row.get("TABLE_TYPE") or "").upper() == "BASE TABLE":
                              cursor.execute(f"SHOW CREATE TABLE `{table_name.replace('`', '``')}`")
                              create_row = cursor.fetchone() or {}
                              entry["show_create_table"] = normalize_create(
                                  str(create_row.get("Create Table") or "")
                              )

                          report["tables"][table_name] = entry

                      if "app_schema_migrations" in report["tables"]:
                          report["migration_keys"] = [
                              str(row["migration_key"])
                              for row in fetch_all(
                                  cursor,
                                  "SELECT migration_key FROM app_schema_migrations ORDER BY migration_key",
                              )
                          ]

                      connection.rollback()

                  if not report["database_name_matches_config"]:
                      report["status"] = "FAIL"
                      report["error_class"] = "DatabaseIdentityMismatch"
                      exit_code = 3
                  else:
                      report["status"] = "PASS"
              except Exception as error:
                  if connection is not None:
                      try:
                          connection.rollback()
                      except Exception:
                          pass
                  report["status"] = "FAIL"
                  report["error_class"] = type(error).__name__
                  args = getattr(error, "args", ())
                  report["error_code"] = args[0] if args and isinstance(args[0], int) else None
                  exit_code = 4
              finally:
                  if connection is not None:
                      connection.close()

          serialized = json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          output = Path("evidence/release-live-schema-readonly.json")
          output.write_text(serialized, encoding="utf-8")
          digest = hashlib.sha256(serialized.encode("utf-8")).hexdigest()
          Path("evidence/release-live-schema-readonly.sha256").write_text(
              f"{digest}  {output.name}\n", encoding="utf-8"
          )

          print(f"status={report['status']}")
          print(f"read_only_transaction_requested={report['read_only_transaction_requested']}")
          print(f"write_operations_executed={report['write_operations_executed']}")
          print(f"business_rows_exported={report['business_rows_exported']}")
          print(f"live_filesystem_write_executed={report['live_filesystem_write_executed']}")
          print(f"table_count={len(report['tables'])}")
          print(f"artifact_sha256={digest}")
          raise SystemExit(exit_code)
          PY

      - name: Upload redacted schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-live-schema-readonly-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize safety boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("evidence/release-live-schema-readonly.json")
          print("## Release live schema – strict read-only preflight")
          if not path.is_file():
              print("\n**FAIL:** no evidence file produced.")
              raise SystemExit(1)

          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"\nStatus: **{report.get('status')}**")
          print(f"\nRead-only transaction requested: `{report.get('read_only_transaction_requested')}`")
          print(f"\nDB writes executed: `{report.get('write_operations_executed')}`")
          print(f"\nBusiness rows exported: `{report.get('business_rows_exported')}`")
          print(f"\nLive filesystem writes executed: `{report.get('live_filesystem_write_executed')}`")
          print(f"\nSchema tables read: `{len(report.get('tables', {}))}`")
          print("\nNo migration, DDL, DML, host upload, deploy or product side effect is part of this workflow.")
          if report.get("status") != "PASS":
              raise SystemExit(1)
          PY
