name: Startpartner Gate 1 Staging Evidence Cleanup

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  staging-cleanup:
    if: github.head_ref == 'evidence/startpartner-gate1-staging-write-2026-07-24'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enforce cleanup-only evidence scope
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ github.event.pull_request.base.ref }}" = "staging" ]
          [ "${{ github.event.pull_request.base.sha }}" = "dd4c4dd43ddcdde952c6f8ee2f0ef3ae7f8c72f6" ]
          mapfile -t changed < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          printf '%s\n' "${changed[@]}"
          [ "${#changed[@]}" -eq 2 ]
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/startpartner-gate1-staging-evidence.yml'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'tools/startpartner-gate1-staging-evidence.php.tpl'

      - name: Render random token-protected cleanup runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-upload/api/internal artifacts/gate1-cleanup
          python3 - <<'PY'
          import hashlib
          import os
          import secrets
          from pathlib import Path

          token = secrets.token_urlsafe(48)
          endpoint_file = f"gate1-cleanup-{secrets.token_hex(20)}.php"
          token_hash = hashlib.sha256(token.encode("utf-8")).hexdigest()
          source = r'''<?php
          declare(strict_types=1);

          const GATE1_CLEANUP_TOKEN_HASH = '__TOKEN_HASH__';

          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store, max-age=0');

          $token = trim((string)($_SERVER['HTTP_X_GATE1_CLEANUP_TOKEN'] ?? ''));
          if ($token === '' || !hash_equals(GATE1_CLEANUP_TOKEN_HASH, hash('sha256', $token))) {
              http_response_code(404);
              echo json_encode(['status' => 'not_found']);
              exit;
          }

          require_once dirname(__DIR__) . '/_bootstrap.php';
          if (be_app_env_value() !== 'staging') {
              http_response_code(404);
              echo json_encode(['status' => 'not_found']);
              exit;
          }

          function gate1_cleanup_table_exists(PDO $pdo, string $table): bool
          {
              $statement = $pdo->prepare(
                  'SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = :table_name'
              );
              $statement->execute(['table_name' => $table]);
              return (int)$statement->fetchColumn() === 1;
          }

          function gate1_cleanup_candidate_ids(PDO $pdo): array
          {
              if (!gate1_cleanup_table_exists($pdo, 'startpartner_candidates')) {
                  return [];
              }
              $statement = $pdo->query(
                  "SELECT id FROM startpartner_candidates
                   WHERE LEFT(organization_name, 20) = 'GATE1_SYNTHETIC_194_'
                     AND CHAR_LENGTH(organization_name) = 36
                   ORDER BY id"
              );
              return array_map(
                  static fn(array $row): string => (string)$row['id'],
                  $statement->fetchAll(PDO::FETCH_ASSOC)
              );
          }

          function gate1_cleanup_remaining(PDO $pdo): array
          {
              $candidateRows = 0;
              if (gate1_cleanup_table_exists($pdo, 'startpartner_candidates')) {
                  $candidateRows = (int)$pdo->query(
                      "SELECT COUNT(*) FROM startpartner_candidates
                       WHERE LEFT(organization_name, 20) = 'GATE1_SYNTHETIC_194_'
                         AND CHAR_LENGTH(organization_name) = 36"
                  )->fetchColumn();
              }
              $caseRows = 0;
              if (gate1_cleanup_table_exists($pdo, 'control_cases')) {
                  $caseRows = (int)$pdo->query(
                      "SELECT COUNT(*) FROM control_cases
                       WHERE source_system = 'startpartner_candidate'
                         AND LEFT(object_title, 20) = 'GATE1_SYNTHETIC_194_'
                         AND CHAR_LENGTH(object_title) = 36"
                  )->fetchColumn();
              }
              return ['candidate_rows' => $candidateRows, 'control_case_rows' => $caseRows];
          }

          try {
              if (($_SERVER['REQUEST_METHOD'] ?? '') !== 'POST') {
                  throw new RuntimeException('Method not allowed.');
              }
              $pdo = be_db();
              $candidateIds = gate1_cleanup_candidate_ids($pdo);
              $before = gate1_cleanup_remaining($pdo);

              if (gate1_cleanup_table_exists($pdo, 'control_cases')) {
                  foreach ($candidateIds as $candidateId) {
                      $deleteCases = $pdo->prepare(
                          "DELETE FROM control_cases
                           WHERE source_system = 'startpartner_candidate'
                             AND source_reference = :candidate_id"
                      );
                      $deleteCases->execute(['candidate_id' => $candidateId]);
                  }
                  $pdo->exec(
                      "DELETE FROM control_cases
                       WHERE source_system = 'startpartner_candidate'
                         AND LEFT(object_title, 20) = 'GATE1_SYNTHETIC_194_'
                         AND CHAR_LENGTH(object_title) = 36"
                  );
              }

              if (gate1_cleanup_table_exists($pdo, 'startpartner_candidates')) {
                  foreach ($candidateIds as $candidateId) {
                      $deleteCandidate = $pdo->prepare('DELETE FROM startpartner_candidates WHERE id = :candidate_id');
                      $deleteCandidate->execute(['candidate_id' => $candidateId]);
                  }
              }

              $after = gate1_cleanup_remaining($pdo);
              $selfDeleted = @unlink(__FILE__);
              http_response_code(200);
              echo json_encode([
                  'status' => 'ok',
                  'environment' => 'staging',
                  'before' => $before,
                  'purged_candidate_count' => count($candidateIds),
                  'after' => $after,
                  'self_deleted' => $selfDeleted,
              ], JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT);
          } catch (Throwable $error) {
              http_response_code(500);
              echo json_encode([
                  'status' => 'error',
                  'error_class' => get_class($error),
                  'error_message' => $error->getMessage(),
              ], JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT);
          }
          '''
          source = source.replace('__TOKEN_HASH__', token_hash)
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in source.splitlines()) + '\n'
          output = Path('evidence-upload/api/internal') / endpoint_file
          output.write_text(source, encoding='utf-8')

          env_file = Path(os.environ['GITHUB_ENV'])
          with env_file.open('a', encoding='utf-8') as handle:
              handle.write(f'GATE1_CLEANUP_TOKEN={token}\n')
              handle.write(f'GATE1_CLEANUP_FILE={endpoint_file}\n')
              handle.write(f'GATE1_CLEANUP_URL=https://staging.bocholt-erleben.de/api/internal/{endpoint_file}\n')
          print(f'::add-mask::{token}')
          print(f'Cleanup endpoint file: {endpoint_file}')
          PY
          cleanup_file="$(find evidence-upload/api/internal -maxdepth 1 -type f -name 'gate1-cleanup-*.php' -print -quit)"
          [ -n "$cleanup_file" ]
          php -l "$cleanup_file" | tee artifacts/gate1-cleanup/php-lint.txt

      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Remove prior runner and upload cleanup endpoint
        shell: bash
        env:
          STRATO_FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
          STRATO_FTP_USERNAME: ${{ secrets.STRATO_FTP_USERNAME }}
          STRATO_FTP_PASSWORD: ${{ secrets.STRATO_FTP_PASSWORD }}
          DEPLOY_TARGET_DIR: staging
        run: |
          set -euo pipefail
          lftp -u "$STRATO_FTP_USERNAME","$STRATO_FTP_PASSWORD" "sftp://$STRATO_FTP_SERVER" -e "set sftp:auto-confirm yes; set cmd:fail-exit no; cd staging; rm api/internal/gate1-evidence-4055527eeaa5010a7ffd942e79660fe17b39f22e.php; bye" || true
          bash scripts/run_strato_sftp_phase.sh evidence-upload 1
          printf 'CLEANUP_UPLOADED=true\n' >> "$GITHUB_ENV"

      - name: Purge all Gate 1 synthetic residues
        shell: bash
        run: |
          set -euo pipefail
          http_status="$(curl -sS \
            --connect-timeout 15 \
            --max-time 120 \
            -o artifacts/gate1-cleanup/result.json \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/json' \
            -H "X-Gate1-Cleanup-Token: $GATE1_CLEANUP_TOKEN" \
            "$GATE1_CLEANUP_URL")"
          printf '%s\n' "$http_status" > artifacts/gate1-cleanup/http-status.txt
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          status = Path('artifacts/gate1-cleanup/http-status.txt').read_text().strip()
          payload = json.loads(Path('artifacts/gate1-cleanup/result.json').read_text())
          assert status == '200', (status, payload)
          assert payload.get('status') == 'ok', payload
          assert payload.get('environment') == 'staging', payload
          assert payload.get('after') == {'candidate_rows': 0, 'control_case_rows': 0}, payload
          assert payload.get('self_deleted') is True, payload
          result = Path('artifacts/gate1-cleanup/result.json')
          digest = hashlib.sha256(result.read_bytes()).hexdigest()
          Path('artifacts/gate1-cleanup/result.sha256').write_text(f'{digest}  result.json\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Remove host files and prove both URLs return 404
        if: always()
        shell: bash
        env:
          STRATO_FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
          STRATO_FTP_USERNAME: ${{ secrets.STRATO_FTP_USERNAME }}
          STRATO_FTP_PASSWORD: ${{ secrets.STRATO_FTP_PASSWORD }}
        run: |
          set +e
          mkdir -p artifacts/gate1-cleanup
          if command -v lftp >/dev/null 2>&1; then
            lftp -u "$STRATO_FTP_USERNAME","$STRATO_FTP_PASSWORD" "sftp://$STRATO_FTP_SERVER" -e "set sftp:auto-confirm yes; set cmd:fail-exit no; cd staging; rm api/internal/${GATE1_CLEANUP_FILE:-missing}; rm api/internal/gate1-evidence-4055527eeaa5010a7ffd942e79660fe17b39f22e.php; bye"
            sftp_status=$?
          else
            sftp_status=127
          fi
          set -e

          old_url='https://staging.bocholt-erleben.de/api/internal/gate1-evidence-4055527eeaa5010a7ffd942e79660fe17b39f22e.php'
          cleanup_removed='false'
          old_removed='false'
          for attempt in $(seq 1 8); do
            cleanup_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "${GATE1_CLEANUP_URL:-https://staging.bocholt-erleben.de/api/internal/missing}?attempt=$attempt" || true)"
            old_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$old_url?attempt=$attempt" || true)"
            printf 'attempt=%s cleanup_status=%s old_status=%s\n' "$attempt" "$cleanup_status" "$old_status" >> artifacts/gate1-cleanup/cleanup-attempts.txt
            [ "$cleanup_status" = '404' ] && cleanup_removed='true'
            [ "$old_status" = '404' ] && old_removed='true'
            if [ "$cleanup_removed" = 'true' ] && [ "$old_removed" = 'true' ]; then
              break
            fi
            sleep 3
          done

          {
            printf 'sftp_status=%s\n' "$sftp_status"
            printf 'cleanup_endpoint_removed=%s\n' "$cleanup_removed"
            printf 'prior_endpoint_removed=%s\n' "$old_removed"
          } > artifacts/gate1-cleanup/cleanup.txt

          [ "$cleanup_removed" = 'true' ]
          [ "$old_removed" = 'true' ]

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startpartner-gate1-staging-cleanup-${{ github.run_id }}
          path: artifacts/gate1-cleanup/
          if-no-files-found: error
          retention-days: 90
