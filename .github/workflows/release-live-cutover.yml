name: Release live cutover 294

on:
  push:
    branches:
      - "release/live-cutover-2026-08-18"
    paths:
      - ".github/workflows/release-live-cutover.yml"
      - "tools/release-live-cutover.php"

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  live-cutover:
    name: SHA-bound Live DB cutover with mandatory cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: main
    env:
      EXPECTED_MAIN_SHA: "87eeb7b075765d94607d174f4af583112285201e"
      EXPECTED_MAIN_BUILD: "87eeb7b07576"
      EXPECTED_RELEASE_SHA: "6b9bfe8fdd61e8ab11d551d1e162f78f5b9e4147"
      STRATO_FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
      STRATO_FTP_USERNAME: ${{ secrets.STRATO_FTP_USERNAME }}
      STRATO_FTP_PASSWORD: ${{ secrets.STRATO_FTP_PASSWORD }}
      STRATO_SFTP_PHASE_ATTEMPTS: "3"
      STRATO_SFTP_RETRY_BASE_SECONDS: "5"
      STRATO_SFTP_MAX_PARALLEL: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout cutover branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable release boundary
        shell: bash
        run: |
          set -euo pipefail
          MAIN_REMOTE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          STAGING_REMOTE="$(git ls-remote origin refs/heads/staging | awk '{print $1}')"
          [ "$MAIN_REMOTE" = "$EXPECTED_MAIN_SHA" ]
          [ "$STAGING_REMOTE" = "$EXPECTED_RELEASE_SHA" ]

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/284")"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_MERGED="$(printf '%s' "$PR_JSON" | jq -r '.merged')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          PR_BASE="$(printf '%s' "$PR_JSON" | jq -r '.base.sha')"
          [ "$PR_STATE" = "open" ]
          [ "$PR_MERGED" = "false" ]
          [ "$PR_HEAD" = "$EXPECTED_RELEASE_SHA" ]
          [ "$PR_BASE" = "$EXPECTED_MAIN_SHA" ]

          LIVE_BUILD="$(curl -fsS --connect-timeout 15 --max-time 45 "https://bocholt-erleben.de/meta/build.txt" | tr -d '\r\n')"
          [ "$LIVE_BUILD" = "$EXPECTED_MAIN_BUILD" ]
          printf 'main_sha=%s\nstaging_sha=%s\npr_head=%s\nlive_build_before=%s\n' \
            "$MAIN_REMOTE" "$STAGING_REMOTE" "$PR_HEAD" "$LIVE_BUILD" > /tmp/release-boundary.txt

      - name: Install SFTP client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Validate cutover writer syntax
        shell: bash
        run: php -l tools/release-live-cutover.php

      - name: Apply exact Live DB cutover and remove writer
        id: cutover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence host-cutover-payload/api host-cutover-empty
          cp /tmp/release-boundary.txt evidence/release-boundary.txt

          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 12)"
          REMOTE_FILE="_release_cutover_${RUN_KEY}.php"
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$TOKEN"
          LIVE_URL="https://bocholt-erleben.de/api/$REMOTE_FILE"

          PRE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$LIVE_URL")"
          printf 'live_http_before_upload=%s\n' "$PRE_CODE" > evidence/release-live-cutover-http.txt
          [ "$PRE_CODE" = "404" ]

          export REMOTE_FILE TOKEN_HASH
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path('tools/release-live-cutover.php').read_text(encoding='utf-8')
          source = source.replace('__TOKEN_HASH__', os.environ['TOKEN_HASH'])
          source = source.replace('__EXPECTED_MAIN_BUILD__', os.environ['EXPECTED_MAIN_BUILD'])
          source = source.replace('__EXPECTED_RELEASE_SHA__', os.environ['EXPECTED_RELEASE_SHA'])
          if '__TOKEN_HASH__' in source or '__EXPECTED_MAIN_BUILD__' in source or '__EXPECTED_RELEASE_SHA__' in source:
              raise SystemExit('cutover writer placeholder replacement incomplete')
          target = Path('host-cutover-payload/api') / os.environ['REMOTE_FILE']
          target.write_text(source, encoding='utf-8')
          PY
          php -l "host-cutover-payload/api/$REMOTE_FILE"

          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path
          paths = [
              'api/sql/009_content_ops_metrics.sql',
              'api/sql/007_runtime_schema_reconciliation.sql',
              'api/sql/008_startpartner_candidates.sql',
              'api/sql/009_control_center_runtime_schema.sql',
              'api/sql/010_startpartner_gate2_qualification_capacity.sql',
              'api/sql/011_startpartner_gate3_terms_organizer_entitlement.sql',
              'api/sql/012_startpartner_gate4_onboarding_content_activation.sql',
          ]
          release_sha = os.environ['EXPECTED_RELEASE_SHA']
          migrations = []
          for path in paths:
              content = subprocess.check_output(['git', 'show', f'{release_sha}:{path}'])
              migrations.append({'path': path, 'content_b64': base64.b64encode(content).decode('ascii')})
          payload = {
              'expected_release_sha': release_sha,
              'expected_current_build': os.environ['EXPECTED_MAIN_BUILD'],
              'migrations': migrations,
          }
          Path('/tmp/release-live-cutover-request.json').write_text(json.dumps(payload, separators=(',', ':')), encoding='utf-8')
          PY

          printf 'rm -f "api/%s"\n' "$REMOTE_FILE" > host-cutover-delete.lftp
          cleanup() {
            set +e
            local status=0
            DEPLOY_TARGET_DIR="." bash scripts/run_strato_sftp_phase.sh host-cutover-empty 1 host-cutover-delete.lftp || status=1
            printf 'cleanup_status=%s\n' "$status" > evidence/release-live-cutover-cleanup.txt
            set -e
            return "$status"
          }
          trap 'cleanup || true' EXIT

          DEPLOY_TARGET_DIR="." bash scripts/run_strato_sftp_phase.sh host-cutover-payload 1

          UNAUTH_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$LIVE_URL")"
          printf 'live_http_without_token=%s\n' "$UNAUTH_CODE" >> evidence/release-live-cutover-http.txt
          [ "$UNAUTH_CODE" = "404" ]

          set +e
          POST_CODE="$(curl -sS -o evidence/release-live-cutover.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 240 \
            -X POST \
            -H "X-BE-Release-Token: $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/release-live-cutover-request.json \
            "$LIVE_URL")"
          CURL_STATUS=$?
          set -e
          printf 'cutover_curl_status=%s\ncutover_http_status=%s\n' "$CURL_STATUS" "$POST_CODE" > evidence/release-live-cutover-status.txt

          VALIDATION_STATUS=0
          if [ "$CURL_STATUS" -ne 0 ] || [ "$POST_CODE" != "200" ]; then
            VALIDATION_STATUS=1
          else
            python - <<'PY' || VALIDATION_STATUS=$?
          import hashlib
          import json
          import os
          from pathlib import Path
          report_path = Path('evidence/release-live-cutover.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('status') != 'PASS': raise SystemExit('cutover report is not PASS')
          if report.get('environment') != 'live': raise SystemExit('environment mismatch')
          if report.get('release_sha') != os.environ['EXPECTED_RELEASE_SHA']: raise SystemExit('release SHA mismatch')
          if report.get('current_build') != os.environ['EXPECTED_MAIN_BUILD']: raise SystemExit('current build mismatch')
          if report.get('personal_or_business_rows_exported') is not False: raise SystemExit('row export safety flag mismatch')
          if report.get('existing_row_counts_unchanged') is not True: raise SystemExit('existing row counts changed')
          action = report.get('action')
          if action not in {'applied', 'already_applied'}: raise SystemExit('unexpected cutover action')
          if action == 'applied' and report.get('write_operations_executed') is not True: raise SystemExit('applied without write flag')
          if action == 'already_applied' and report.get('write_operations_executed') is not False: raise SystemExit('already-applied write flag mismatch')
          after = report.get('state_after') or {}
          expected_keys = sorted([
              '007_runtime_schema_reconciliation','008_startpartner_candidates','009_control_center_runtime_schema',
              '010_startpartner_gate2_qualification_capacity','011_startpartner_gate3_terms_organizer_entitlement',
              '012_startpartner_gate4_onboarding_content_activation',
          ])
          if after.get('migration_keys') != expected_keys: raise SystemExit('migration keys mismatch')
          if any(int(v) != 0 for v in (after.get('startpartner_row_counts') or {}).values()): raise SystemExit('Startpartner rows are not zero')
          if any(int(v) != 0 for v in (after.get('content_ops_row_counts') or {}).values()): raise SystemExit('Content-Ops rows are not zero')
          if any(int(v) != 0 for v in (after.get('control_orphan_counts') or {}).values()): raise SystemExit('Control Center orphan count nonzero')
          flags = after.get('submissions_flags') or {}
          if flags.get('idx_submissions_organizer_edited_at') is not True: raise SystemExit('organizer edited index missing')
          if action == 'applied':
              expected_paths = [
                  'api/sql/009_content_ops_metrics.sql','api/sql/007_runtime_schema_reconciliation.sql',
                  'api/sql/008_startpartner_candidates.sql','api/sql/009_control_center_runtime_schema.sql',
                  'api/sql/010_startpartner_gate2_qualification_capacity.sql','api/sql/011_startpartner_gate3_terms_organizer_entitlement.sql',
                  'api/sql/012_startpartner_gate4_onboarding_content_activation.sql',
              ]
              if [item.get('path') for item in report.get('migration_results', [])] != expected_paths:
                  raise SystemExit('executed migration order mismatch')
          raw = report_path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          summary = {
              'overall_status': 'PASS', 'action': action, 'release_sha': report.get('release_sha'),
              'current_build': report.get('current_build'), 'server_version': after.get('server_version'),
              'migration_keys': after.get('migration_keys'), 'startpartner_table_count': len(after.get('startpartner_existing') or []),
              'startpartner_rows_all_zero': True, 'content_ops_rows_all_zero': True,
              'existing_row_counts_unchanged': True, 'control_orphan_counts': after.get('control_orphan_counts'),
              'report_sha256': digest,
          }
          Path('evidence/release-live-cutover-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f"cutover_action={action}")
          print(f"report_sha256={digest}")
          PY
          fi

          CLEANUP_STATUS=0
          cleanup || CLEANUP_STATUS=$?
          POST_CLEAN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$LIVE_URL")"
          printf 'live_http_after_cleanup=%s\n' "$POST_CLEAN_CODE" >> evidence/release-live-cutover-http.txt
          trap - EXIT

          [ "$CLEANUP_STATUS" -eq 0 ]
          [ "$POST_CLEAN_CODE" = "404" ]
          [ "$VALIDATION_STATUS" -eq 0 ]

      - name: Upload cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-live-cutover-294-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Publish sanitized cutover pointer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path
          summary_path = Path('evidence/release-live-cutover-summary.json')
          cleanup_path = Path('evidence/release-live-cutover-cleanup.txt')
          http_path = Path('evidence/release-live-cutover-http.txt')
          status_path = Path('evidence/release-live-cutover-status.txt')
          print('## Live DB cutover evidence')
          print()
          print(f"- run_id: `{os.environ.get('GITHUB_RUN_ID')}`")
          print(f"- head_sha: `{os.environ.get('GITHUB_SHA')}`")
          if summary_path.is_file():
              data=json.loads(summary_path.read_text(encoding='utf-8'))
              print(f"- cutover_status: **{data.get('overall_status')}**")
              print(f"- action: `{data.get('action')}`")
              print(f"- release_sha: `{data.get('release_sha')}`")
              print(f"- server_version: `{data.get('server_version')}`")
              print(f"- migration_keys: `{len(data.get('migration_keys') or [])}`")
              print(f"- startpartner_table_count: `{data.get('startpartner_table_count')}`")
              print(f"- startpartner_rows_all_zero: `{data.get('startpartner_rows_all_zero')}`")
              print(f"- existing_row_counts_unchanged: `{data.get('existing_row_counts_unchanged')}`")
              print(f"- report_sha256: `{data.get('report_sha256')}`")
          else:
              print('- cutover_status: **FAIL / no validated summary**')
          if status_path.is_file():
              for line in status_path.read_text(encoding='utf-8').splitlines(): print(f"- {line}")
          print(f"- cleanup: `{cleanup_path.read_text(encoding='utf-8').strip() if cleanup_path.is_file() else 'missing'}`")
          if http_path.is_file():
              for line in http_path.read_text(encoding='utf-8').splitlines():
                  if line.startswith('live_http_after_cleanup='): print(f"- {line}")
          print()
          print('No partner communication, mail, Magic Link, Stripe, Formspree, publication, entitlement or real Startpartner operation was executed.')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/294/comments" -f body="$(cat /tmp/comment.md)"
