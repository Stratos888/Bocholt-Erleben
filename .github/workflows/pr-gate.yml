name: PR Gate

on:
  pull_request:
    branches: ["staging", "main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR and select test plan
        id: contract
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_pr_contract.py

      - name: Check patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Quick draft validation
        if: github.event.pull_request.draft == true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate-repo.sh quick 2>&1 | tee "${RUNNER_TEMP}/validation.log"

      - name: Documentation validation
        if: github.event.pull_request.draft == false && steps.contract.outputs.plan == 'docs'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate-repo.sh docs 2>&1 | tee "${RUNNER_TEMP}/validation.log"

      - name: Quick review validation
        if: github.event.pull_request.draft == false && steps.contract.outputs.plan == 'quick'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate-repo.sh quick 2>&1 | tee "${RUNNER_TEMP}/validation.log"

      - name: Backend review validation
        if: github.event.pull_request.draft == false && steps.contract.outputs.plan == 'backend'
        shell: bash
        env:
          VALIDATION_COMPONENTS: ${{ steps.contract.outputs.backend_components }}
        run: |
          set -o pipefail
          bash scripts/validate-repo.sh backend 2>&1 | tee "${RUNNER_TEMP}/validation.log"

      - name: Frontend review validation
        if: github.event.pull_request.draft == false && steps.contract.outputs.plan == 'frontend'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate-repo.sh frontend 2>&1 | tee "${RUNNER_TEMP}/validation.log"

      - name: Full review validation
        if: github.event.pull_request.draft == false && steps.contract.outputs.plan == 'full'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate-repo.sh 2>&1 | tee "${RUNNER_TEMP}/validation.log"

      - name: Upload repository validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/validation.log
          if-no-files-found: warn

      - name: Setup Node for browser contracts
        if: github.event.pull_request.draft == false && steps.contract.outputs.browser == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser runtime
        if: github.event.pull_request.draft == false && steps.contract.outputs.browser == 'true'
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Run bounded synthetic event-navigation contract
        if: github.event.pull_request.draft == false && steps.contract.outputs.browser_event == 'true'
        shell: bash
        env:
          SMOKE_OUT_DIR: ${{ runner.temp }}/browser-smoke-synthetic
        run: bash scripts/run-event-navigation-fixture-smoke.sh

      - name: Run bounded mobile exception-review contract
        if: github.event.pull_request.draft == false && steps.contract.outputs.browser_control == 'true'
        shell: bash
        env:
          SMOKE_OUT_DIR: ${{ runner.temp }}/browser-smoke-control-center-mobile
        run: bash scripts/run-control-center-mobile-exception-review-smoke.sh

      - name: Upload bounded synthetic browser evidence
        if: always() && github.event.pull_request.draft == false && steps.contract.outputs.browser_event == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-event-navigation-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/browser-smoke-synthetic/
          if-no-files-found: warn

      - name: Upload mobile exception-review evidence
        if: always() && github.event.pull_request.draft == false && steps.contract.outputs.browser_control == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: control-center-mobile-exception-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/browser-smoke-control-center-mobile/
          if-no-files-found: warn
