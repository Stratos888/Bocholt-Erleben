name: SEO Event Title Link Patch

on:
  push:
    branches:
      - seo/event-title-internal-links-452

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded P1 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          events_path = "js/events.js"

          replace_once(
              events_path,
              '''  const resolveEventDetailUrl = (ev) => {
            const absolute = String(ev?.detail_url || ev?.detailUrl || "").trim();
            if (absolute) {
              try {
                const parsed = new URL(absolute, window.location.origin);
                if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
              } catch (_) {}
            }

            const path = String(ev?.detail_path || ev?.detailPath || "").trim();
            if (path && path.startsWith("/events/") && path.endsWith("/")) {
              try {
                return new URL(path, window.location.origin).href;
              } catch (_) {}
            }

            return "";
          };''',
              '''  const resolveEventDetailUrl = (ev) => {
            const path = String(ev?.detail_path || ev?.detailPath || "").trim();
            if (path && path.startsWith("/events/") && path.endsWith("/")) {
              try {
                return new URL(path, window.location.origin).href;
              } catch (_) {}
            }

            const absolute = String(ev?.detail_url || ev?.detailUrl || "").trim();
            if (absolute) {
              try {
                const parsed = new URL(absolute, window.location.origin);
                if (
                  parsed.origin === window.location.origin &&
                  parsed.pathname.startsWith("/events/") &&
                  parsed.pathname.endsWith("/")
                ) {
                  return parsed.href;
                }
              } catch (_) {}
            }

            return "";
          };''',
          )

          replace_once(
              events_path,
              '''  const titleText = document.createElement("span");
            titleText.className = "event-title__text";
            titleText.textContent = event?.title ? String(event.title) : "Event";
            h3.appendChild(titleText);''',
              '''  const canonicalDetailUrl = resolveEventDetailUrl(event);
            const titleText = document.createElement(canonicalDetailUrl ? "a" : "span");
            titleText.className = canonicalDetailUrl
              ? "event-title__text event-title__link"
              : "event-title__text";
            titleText.textContent = event?.title ? String(event.title) : "Event";
            if (canonicalDetailUrl) {
              titleText.href = canonicalDetailUrl;
              titleText.tabIndex = -1;
            }
            h3.appendChild(titleText);''',
          )

          replace_once(
              events_path,
              '''  const canonicalShareUrl = resolveEventDetailUrl(event) || primaryUrl;''',
              '''  const canonicalShareUrl = canonicalDetailUrl || primaryUrl;''',
          )

          replace_once(
              events_path,
              '''  /* === END BLOCK: RESPONSIVE_EVENT_CARD_NAVIGATION_V6 === */

            card.addEventListener("click", (e) => {''',
              '''  /* === END BLOCK: RESPONSIVE_EVENT_CARD_NAVIGATION_V6 === */

            /* === BEGIN BLOCK: EVENT_TITLE_CANONICAL_LINK_V1 | Purpose: expose the existing canonical event detail URL as a real internal href while preserving established mobile panel and desktop outbound behavior === */
            if (canonicalDetailUrl) {
              titleText.addEventListener("click", (e) => {
                const isPlainPrimaryClick =
                  e.button === 0 &&
                  !e.metaKey &&
                  !e.ctrlKey &&
                  !e.shiftKey &&
                  !e.altKey;

                if (!isPlainPrimaryClick) return;

                if (isDesktopViewport() && !primaryUrl) {
                  return;
                }

                openCard(e);
              });
            }
            /* === END BLOCK: EVENT_TITLE_CANONICAL_LINK_V1 === */

            card.addEventListener("click", (e) => {''',
          )

          replace_once(
              "css/components.css",
              '''.event-title__text{
            min-width: 0;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;

            overflow-wrap: break-word;
            word-break: normal;
            hyphens: none;
          }''',
              '''.event-title__text{
            min-width: 0;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;

            overflow-wrap: break-word;
            word-break: normal;
            hyphens: none;
          }

          .event-title__link,
          .event-title__link:visited,
          .event-title__link:hover{
            color: inherit;
            text-decoration: none;
          }''',
          )

          replace_once(
              "scripts/browser-smoke.mjs",
              '''  const card = page.locator('#event-cards .event-card').filter({ hasText: 'Kinderzaubershow' }).first();
            await card.waitFor({ state: 'visible', timeout: timeoutMs });

            if (profileName === 'desktop') {''',
              '''  const card = page.locator('#event-cards .event-card').filter({ hasText: 'Kinderzaubershow' }).first();
            await card.waitFor({ state: 'visible', timeout: timeoutMs });

            const internalTitleLink = card.locator('h3.event-title a.event-title__link[href]').first();
            await internalTitleLink.waitFor({ state: 'attached', timeout: timeoutMs });
            const internalTarget = await internalTitleLink.getAttribute('href');
            const resolvedInternalTarget = internalTarget ? new URL(internalTarget, `${baseUrl}/`) : null;
            const expectedDetailPath = '/events/du-wunderst-mich-kinderzaubershow-endrik-thier-2099-09-27/';
            if (
              !resolvedInternalTarget ||
              resolvedInternalTarget.origin !== new URL(baseUrl).origin ||
              resolvedInternalTarget.pathname !== expectedDetailPath
            ) {
              throw new Error(`Eventtitel besitzt keinen kanonischen internen Detail-Link: ${internalTarget || 'leer'}`);
            }
            if (await internalTitleLink.getAttribute('tabindex') !== '-1') {
              throw new Error('Der kanonische Eventtitel-Link darf den bestehenden Karten-Tabvertrag nicht erweitern.');
            }

            if (profileName === 'desktop') {''',
          )

          replace_once(
              "scripts/browser-smoke.mjs",
              '''    await card.locator('h3').click({ timeout: 7000 });
            await expectVisible(page, '#event-detail-panel:not(.hidden)');''',
              '''    await internalTitleLink.click({ timeout: 7000 });
            await expectVisible(page, '#event-detail-panel:not(.hidden)');''',
          )
          PY

          node --check js/events.js
          node --check scripts/browser-smoke.mjs
          git diff --check

      - name: Commit bounded patch and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/seo-event-title-link-patch.yml
          git add js/events.js css/components.css scripts/browser-smoke.mjs
          git commit -m "SEO: link event titles to canonical detail pages (#452)"
          git push origin HEAD
