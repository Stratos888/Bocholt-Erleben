<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gate-4-Steuerzentrale – synthetische Fixture</title>
  <link rel="stylesheet" href="../../css/style.css?v=2026-06-22-css-governance-v1">
</head>
<body class="cc-page">
  <header class="cc-header"><div><p class="cc-eyebrow">Bocholt erleben</p><h1 id="cc-title">Prüfen</h1></div></header>
  <main class="cc-main"><section id="cc-content"><div class="cc-status" id="cc-status" role="status"></div><div id="cc-view"></div></section></main>
  <nav class="cc-nav" aria-label="Steuerzentrale"><button type="button" data-view="overview"><span>Übersicht</span></button><button type="button" data-view="review" class="is-active"><span>Prüfen</span></button><button type="button" data-view="backlog"><span>Backlog</span></button><button type="button" data-view="manage"><span>Verwaltung</span></button><button type="button" data-view="development"><span>Entwicklung</span></button></nav>
  <dialog id="cc-dialog" class="cc-dialog"><form method="dialog" class="cc-dialog__card" id="cc-dialog-form" novalidate><button class="cc-dialog__close" id="cc-dialog-close" type="button">×</button><div id="cc-dialog-body"></div></form></dialog>
  <form id="cc-auth-form" hidden><input id="cc-password"><button id="cc-refresh"></button><button id="cc-menu-button"></button></form><section id="cc-auth" hidden></section><b id="cc-badge-review" hidden></b><b id="cc-badge-backlog" hidden></b>
  <script type="module">
    import { state, els, closeDialog } from '../../js/control-center/shared.js?v=2026-07-16-e2e-state-v5';
    import { configureReviewRenderer, renderReview } from '../../js/control-center/review-render.js?v=2026-08-01-startpartner-gate4-audit-v1';
    import { handleGate4Action } from '../../js/control-center/startpartner-gate4.js?v=2026-08-01-startpartner-gate4-audit-v1';

    const scenario = new URLSearchParams(location.search).get('scenario') || 'onboarding';
    const keys = [
      'terms_confirmed','organizer_linked','contact_confirmed','portal_access_tested',
      'pilot_entitlement_readback','service_scope_confirmed','sources_recorded','maintenance_path_agreed',
      'content_rights_cleared','first_content_ready','editorial_review_ready','measurement_ready',
      'distribution_ready','activation_target_set',
    ];
    const manual = new Set(['portal_access_tested','content_rights_cleared','activation_target_set']);
    const completeKeys = scenario === 'onboarding'
      ? new Set(['terms_confirmed','organizer_linked','contact_confirmed','pilot_entitlement_readback','service_scope_confirmed','sources_recorded','maintenance_path_agreed','content_rights_cleared','activation_target_set'])
      : new Set(keys);
    const items = keys.map(key => ({
      item_key:key,
      status:completeKeys.has(key)?'complete':'pending',
      is_required:1,
      is_hard_blocker:1,
      is_manual:manual.has(key)?1:0,
      evidence_text:completeKeys.has(key)?`Synthetischer Nachweis: ${key}`:null,
      revision:completeKeys.has(key)?2:0,
    }));
    const contentStatus = scenario === 'onboarding' ? 'draft' : scenario === 'active' ? 'approved' : 'editorial_ready';
    const gate4 = {
      phase:scenario === 'active'?'active':scenario === 'ready'?'activation_ready':'onboarding',
      complete:scenario === 'active',
      active:scenario === 'active',
      activation_ready:scenario === 'ready',
      pilot:{
        id:'24100000-0000-4000-8000-000000000002',
        status:scenario === 'active'?'active':scenario === 'ready'?'activation_ready':'onboarding',
        revision:7,
        activation_date_local:scenario === 'active'?'2026-08-01':null,
        planned_end_date:scenario === 'active'?'2027-02-01':null,
      },
      onboarding:{
        ready:scenario !== 'onboarding',
        completed_count:items.filter(row=>row.status==='complete').length,
        total_count:14,
        items,
        blockers:items.filter(row=>row.status!=='complete').map(row=>({item_key:row.item_key,message:'Ein erforderlicher Schritt der Piloteinrichtung ist noch offen.'})),
      },
      content_links:[{
        id:'24100000-0000-4000-8000-000000000010',
        submission_id:4241,
        content_type:'event',
        status:contentStatus,
        title:'Synthetischer Startpartner-Kulturtag',
        start_date:'2026-09-12',
      }],
      first_content:{
        id:'24100000-0000-4000-8000-000000000010',
        submission_id:4241,
        content_type:'event',
        status:contentStatus,
        title:'Synthetischer Startpartner-Kulturtag',
        start_date:'2026-09-12',
      },
      ready_measurement:scenario === 'onboarding'?null:{id:'24100000-0000-4000-8000-000000000020',metrics_owner:'value_metric_daily',checked_at:'2026-08-01 10:00:00'},
      ready_distribution:scenario === 'onboarding'?null:{id:'24100000-0000-4000-8000-000000000030',channel:'Newsletter',planned_at:'2026-08-08 22:00:00'},
      blockers:scenario === 'onboarding'?[{code:'required_item_open',item_key:'portal_access_tested',message:'Der Veranstalterzugang ist noch nicht getestet.'}]:[],
      capacity:{occupied_slots:1,active_pilots:scenario==='active'?1:0,active_reservations:scenario==='active'?0:1,hard_stop_at:8,soft_stop_at:6},
    };
    const candidate = {
      id:'19900000-0000-0000-0000-000000009999',
      organization_name:'Gate-4-Kulturverein Bocholt',source:'targeted_outreach',desired_content_scope:'both',
      status:'accepted_pending_terms',revision:12,assigned_to:'M. Muster',next_review_at:'2026-08-04 10:00:00',
      website_url:'https://example.org/startpartner',description_text:'Lokaler Kulturverein mit Veranstaltungen und Aktivitäten.',
      contacts:[{contact_name:'Erika Beispiel',contact_role:'Vorstand',email:'erika@example.org',phone:'02871 12345',is_primary:true}],
      qualifications:[],readiness:{ready:true,assessed_count:14,total_count:14,blockers:[]},
      capacity:gate4.capacity,reservations:scenario==='active'?[]:[{id:77,status:'active',starts_at:'2026-07-25 10:00:00',ends_at:'2026-08-20 10:00:00'}],
      active_reservation:scenario==='active'?null:{id:77,status:'active',starts_at:'2026-07-25 10:00:00',ends_at:'2026-08-20 10:00:00'},
      waitlist:null,decision:{result:'accepted_pending_terms',reason:'Fachlich geeignet.'},events:[],
      gate3:{
        complete:true,blockers:[],
        terms_acceptance:{id:301,terms_version:'pilot-terms-v1',terms_reference:'repo://pilot-terms-v1',terms_digest:'a'.repeat(64),accepting_person:'Erika Beispiel',accepting_organization:'Gate-4-Kulturverein Bocholt',accepted_at:'2026-07-27 20:00:00',confirmation_channel:'operator_recorded'},
        organizer:{id:401,organization_name:'Gate-4-Kulturverein Bocholt',email:'erika@example.org'},
        pilot:gate4.pilot,
        scopes:[{scope_key:'events',limit_value:8,is_unlimited:false,period_unit:'pilot_month'},{scope_key:'activities',limit_value:1,is_unlimited:false,period_unit:'concurrent'}],
        entitlement:{id:'23100000-0000-4000-8000-000000000002',status:scenario==='active'?'active':'pending_activation',starts_at:null,ends_at:null},
        events:[],
      },
      gate4,
    };
    const item = {
      id:'fixture-gate4',type:'intake',queue_group:'startpartner',case_kind:'startpartner_candidate',state:'in_progress',
      title:`Startpartner prüfen: ${candidate.organization_name}`,display_status:'Piloteinrichtung',
      primary_action:{key:'details',label:'Pilotstatus prüfen'},secondary_actions:[],startpartner_candidate:candidate,
      decision_context:{candidate_id:candidate.id,candidate_status:candidate.status,candidate_revision:candidate.revision,readiness:candidate.readiness,capacity:candidate.capacity,assigned_to:candidate.assigned_to,next_review_at:candidate.next_review_at,gate3:candidate.gate3,gate4:candidate.gate4},
      source:{system:'startpartner_candidate',reference:candidate.id},object:{id:candidate.id,title:candidate.organization_name,type:'startpartner_candidate'},
    };
    state.reviewGroup='all'; state.reviewIndex=0; state.cases=[item];
    window.__gate4Candidate=candidate; window.__fixtureReloads=0;
    const reload=async()=>{window.__fixtureReloads+=1;return true;};
    configureReviewRenderer({handleAction:async(current,action)=>handleGate4Action(current,action,reload)});
    document.querySelector('#cc-dialog-close')?.addEventListener('click',closeDialog);
    renderReview();
    document.documentElement.dataset.fixtureReady='true';
  </script>
</body>
</html>
